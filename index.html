    <script>
      // Gracefully capture and suppress WebSocket HMR connection errors and unhandled rejections in iframe/sandbox environments
      (function() {
        const isIgnored = (arg) => {
          if (!arg) return false;
          try {
            const str = String(arg.message || arg.stack || (typeof arg === 'object' ? JSON.stringify(arg) : arg)).toLowerCase();
            return str.includes('websocket') || str.includes('hmr') || str.includes('web socket') || str.includes('closed without opened');
          } catch (_) {
            return false;
          }
        };

        // 1. Hook console.warn and console.error to filter out HMR and WebSocket-related messages,
        // preventing dev tool wrappers or iframe error overlays from picking them up and showing alerts.
        const originalWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(isIgnored)) {
            return; // Silently swallow HMR/WebSocket logs
          }
          originalWarn.apply(console, args);
        };

        const originalError = console.error;
        console.error = function(...args) {
          if (args.some(isIgnored)) {
            return; // Silently swallow HMR/WebSocket logs
          }
          originalError.apply(console, args);
        };

        // 2. Intercept window-level errors and unhandled promise rejections related to HMR/WebSockets
        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          if (reason && isIgnored(reason)) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = event.message || '';
          const target = event.target || {};
          const isWsTarget = (typeof WebSocket !== 'undefined' && target instanceof WebSocket) || 
                             (target.tagName === undefined && (String(target.url || '').startsWith('ws:') || String(target.url || '').startsWith('wss:')));
          if (isWsTarget || isIgnored(msg) || isIgnored(event.error)) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);

        // 3. Wrap window.WebSocket to safely swallow connection errors in the iframe environment
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          const WrappedWebSocket = function(url, protocols) {
            try {
              // Direct silent bypass for Vite HMR connections to prevent console warnings in proxy iframes
              if (typeof url === 'string' && (url.includes('vite') || url.includes('localhost') || url.includes('127.0.0.1:3000') || url.includes('ws://'))) {
                const mock = Object.create(OriginalWebSocket.prototype);
                Object.assign(mock, {
                  addEventListener: () => {},
                  removeEventListener: () => {},
                  send: () => {},
                  close: () => {},
                  readyState: 3 // CLOSED
                });
                return mock;
              }
              const socket = Reflect.construct(OriginalWebSocket, arguments);
              socket.addEventListener('error', function(e) {
                // Silently swallow proxy/iframe connection failures
                if (e) {
                  try {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                  } catch (_) {}
                }
              }, true);
              return socket;
            } catch (err) {
              const mock = Object.create(OriginalWebSocket.prototype);
              Object.assign(mock, {
                addEventListener: () => {},
                removeEventListener: () => {},
                send: () => {},
                close: () => {},
                readyState: 3 // CLOSED
              });
              return mock;
            }
          };
          WrappedWebSocket.prototype = OriginalWebSocket.prototype;
          Object.setPrototypeOf(WrappedWebSocket, OriginalWebSocket);
          window.WebSocket = WrappedWebSocket;
        }
      })();
    </script>
